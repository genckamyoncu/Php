[package]
name = "base-rpc-health"
version = "0.1.0"
edition = "2021"

[dependencies]
ethers = { version = "2.0", default-features = false, features = ["ws", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
